<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Red rounded background, matches the primary brand accent -->
  <rect width="64" height="64" rx="13" fill="#dc2626"/>

  <!-- White notebook page -->
  <rect x="14" y="13" width="30" height="38" rx="3" fill="#ffffff"/>

  <!-- Yellow bookmark spine on the right -->
  <rect x="44" y="13" width="6" height="38" rx="2" fill="#fbbf24"/>
  <rect x="44" y="46" width="6" height="5" fill="#facc15"/>
  <polygon points="44,46 50,46 47,51" fill="#dc2626"/>

  <!-- Diary entry lines -->
  <rect x="20" y="22" width="18" height="3" rx="1.5" fill="#dc2626"/>
  <rect x="20" y="30" width="14" height="3" rx="1.5" fill="#9ca3af"/>
  <rect x="20" y="38" width="16" height="3" rx="1.5" fill="#9ca3af"/>
</svg>
